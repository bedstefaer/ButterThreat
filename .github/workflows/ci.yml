name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks make
          sudo luarocks install luacheck

      - name: Lint and test
        run: make check

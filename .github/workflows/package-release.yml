name: Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version from tag
        id: version
        run: |
          if [ -n "${{ github.ref_name }}" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi
      
      - name: Create TOC with version
        run: |
          # Update the version in the TOC file
          sed -i "s/## Version: .*/## Version: ${{ steps.version.outputs.VERSION }}/" RPGThreat.toc
      
      - name: Create release package
        run: |
          mkdir -p release
          # Create a clean package without .git and .github directories
          cp -r RPGThreat.toc RPGThreat.lua README.md QUICKSTART.md Sounds release/
          
          # Create zip package
          cd release
          zip -r ../RPGThreat-${{ steps.version.outputs.VERSION }}.zip .
          cd ..
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPGThreat-${{ steps.version.outputs.VERSION }}
          path: RPGThreat-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 30
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RPGThreat-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip
      
      - name: Update TOC version
        run: |
          echo "Current TOC:"
          cat RPGThreat.toc
          sed -i "s/^## Version: .*/## Version: ${{ steps.version.outputs.VERSION }}/" RPGThreat.toc
          echo "Updated TOC:"
          cat RPGThreat.toc
      
      - name: Create release package
        run: |
          mkdir -p release/RPGThreat
          cp RPGThreat.toc release/RPGThreat/
          cp RPGThreat.lua release/RPGThreat/
          cp README.md release/RPGThreat/
          cp QUICKSTART.md release/RPGThreat/
          cp package.sh release/RPGThreat/
          cp package.bat release/RPGThreat/
          mkdir -p release/RPGThreat/Sounds
          cp Sounds/*.ogg release/RPGThreat/Sounds/ 2>/dev/null || true
          
          cd release
          zip -r RPGThreat-${{ steps.version.outputs.VERSION }}.zip RPGThreat
          cd ..
          echo "Package created:"
          ls -lh release/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPGThreat-${{ steps.version.outputs.VERSION }}
          path: release/RPGThreat-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 30
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/RPGThreat-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
